<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join-US</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/joinus.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
body{
    min-height: 100vh;
    height: auto;
}

.container{
    display: flex;
    min-height: 100vh;
    height: auto;
}

.right-side{
    padding: 50px;
    flex: 1.75;
    background-color: lemonchiffon;
    /* padding:60px; */
    opacity: 0;
    animation: fadeInUp 0.8s ease-out forwards;
}

.left-side{
    flex: 1;
    position: relative;
    background: linear-gradient(135deg,#0F081A,#1E1530);
    background-image: url("assets/images/joinphoto.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction:column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color:white;
    text-align:center;
    padding:60px;
    opacity: 0;
    animation: fadeInUp 0.8s ease-out forwards;
}

.left-side::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(15,8,26,.65),
        rgba(15,8,26,.85)
    );
}

.left-content{
    position: relative;
    z-index: 2;
    color: white;
    text-align: center;
    padding: 40px;
}

.left-content img{
    width: 250px;
}

.right-side .msg{
    font-size: 3rem;
}

p {
    color: darkgoldenrod;
}

.right-side {
    width: 50%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 50px 80px;
    box-sizing: border-box;
    background-color: #F7F2D0;
}

.right-side h1 {
    width: 100%;
    max-width: 650px;
    text-align: center;
    font-size: 32px;
    line-height: 1.5;
    color: #171126;
    margin-bottom: 20px;
    padding: 10px;
    border-bottom: 2px solid rgb(8, 2, 29);
}

.right-side form {
    width: 100%;
    max-width: 550px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.form-group label {
    font-size: 17px;
    font-weight: bold;

    color: #171126;

    text-align: right;
}

.form-group input {
    width: 100%;
    height: 48px;
    padding: 0 15px;
    box-sizing: border-box;
    border: 2px solid #d4d0a5;
    border-radius: 8px;
    background-color: white;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

.form-group input:focus {
    border-color: #6b4bb3;
    box-shadow: 0 0 0 3px rgba(107, 75, 179, 0.15);
}

.right-side button {
    width: 100%;
    height: 50px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background-color: #6b4bb3;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.right-side button:hover {
    background-color: #51378c;
    transform: translateY(-2px);
}

.erorr {
    font-size: 10px;
    color: red;
}

.hook > *{
        display: none;
    }

@media (max-width: 640px) and (min-width: 220px){
    .right-side h1{
        padding: 32px 8px;
        font-size: 20px;
    }

    .right-side{
        padding: 10px 18px;
        width: 100%;
    }

    .hook {
        background: linear-gradient(135deg,#0F081A,#1E1530);
        background-image: url("assets/images/joinphoto.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 50%;
        position: relative;
        /* width: 100%; */
    }

    .left-side {
        display: none;
    }

    /*important*/
    .hook img {
        position: absolute;
        top: 0;
        right: 0;
        width: 25%;
    }

    .hook span {
        position: absolute;
        bottom: 0;
        left: 0;
        padding: 10px;
        font-size: 1rem;
    }

    .hook {
        position: relative;
        width: 100%;
        height: 20vh;
    }

    .hook::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(15,8,26,.65),
        rgba(15,8,26,.85)
        );
    }

     .hook > * { 
        display: block;  
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="right-side">
            <!-- <h1 class="msg">الانضمام مغلق حاليا :)</h1> -->

            <div class="hook">
                <div class="logo">
                    <img src="assets/images/SCOUT.png" alt="clan's logo">
                    <span><p>كٌــن جــزءاً مــن فريــق، كٌــن انــت</p></span>
                </div>
            </div>
            <h1>الانضمام لعشيرة جوالة كلية العلوم  <br> جامعة عين شمس ⚜️ </h1>

            <form id="join-form">
                <div class="form-group">
                    <label>الاسم</label>
                    <input type="text" id="name">
                    <span class="erorr" id="nameErorr"></span>
                </div>
        
                <div class="form-group">
                    <label>رقم التليفون</label>
                    <input type="text" id="phone">
                    <span class="erorr" id="phoneErorr"></span>
                </div>
        
                <div class="form-group">
                    <label>الفرقة</label>
                    <input type="text" id="level">
                    <span class="erorr" id="levelErorr"></span>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email">
                    <span class="erorr" id="emailErorr"></span>
                </div>

                <button type="submit">الانضمام</button>
            </form>
        </div>
        <div class="left-side">
            <div class="left-content">
                <img src="assets/images/SCOUT.png" alt="clan's logo">
                <p>كٌــن جــزءاً مــن فريــق، كٌــن انــت</p>
            </div>
        </div>
    </div>

    <script src="js/join.js" type="module"></script>
</body>
</html>

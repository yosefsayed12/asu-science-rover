<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join-US</title>
    <link rel="stylesheet" href="css/fonts.css">
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        .container{
            display: flex;
            height: 100vh;
        }

        .left{
            flex: 1;
            background-color: #0F081A;
            
        }

        .right{
            flex: 1.5;
            background-color: #211736;
            border-left: 2px solid #C7921B;
        }
        
        .left img{
            right: 50%;
            top: 50%;
            width: 600px;
            opacity: .5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="right"></div>
        <div class="left">
            <img src="assets/images/outlinephoto.jpg" alt="">
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join-US</title>
    <link rel="stylesheet" href="css/fonts.css">
    <!-- <link rel="stylesheet" href="css/joinus.css"> -->
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    height: 100vh;
}

.container{
    display: flex;
    height: 100vh;
}

.left-side{
    background: linear-gradient(135deg,#0F081A,#1E1530);
    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:60px;
}

.right-side{
    padding: 50px;
    flex: 1.75;
    background-color: lemonchiffon;
    /* padding:60px; */
}

.left-side{
    flex: 1;
    position: relative;
    background-image: url("assets/images/joinphoto.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.left-side::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(15,8,26,.65),
        rgba(15,8,26,.85)
    );
}

.left-content{
    position: relative;
    z-index: 2;
    color: white;
    text-align: center;
    padding: 40px;
}

.left-content img{
    width: 250px;
}

.right-side .msg{
    font-size: 3rem;
}

p {
    color: darkgoldenrod;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="right-side">
            <!-- <h1 class="msg">الانضمام مغلق حاليا :)</h1> -->
            <h1>الانضمام لعشيرة جوالة كلية العلوم - <br> جامعة عين شمس ⚜️ </h1>

            <form action="">
                <input type="text" name="username">
                <input type="text" name="phoneNum">
                <input type="text" name="stuedentLevel">
                <input type="text" name="stuedentprogram">
                <button>الانضمام</button>
            </form>
        </div>
        <div class="left-side">
            <div class="left-content">
                <img src="assets/images/SCOUT.png" alt="clan's logo">
                <p>كٌــن جــزءاً مــن فريــق، كٌــن انــت</p>
            </div>
        </div>
    </div>
</body>
</html>

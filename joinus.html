<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join to ASUSCIRover</title>

    <link rel="stylesheet" href="css/joinus.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <main class="registration-page">

        <!-- Hero -->
        <section class="hero">

            <img src="assets/images/SCOUT.png" alt="ASU Science Rover Logo" class="logo">

            <div class="hero-overlay"></div>

            <div class="hero-content">
                <h1>كُن جزءًا من فريق</h1>
                <p>كُن أنت</p>
            </div>

        </section>


        <!-- Registration -->
        <section class="registration-section">

            <div class="page-title">

                <!-- <span class="title-icon">
                    <i class="fa-solid fa-fleur-de-lis"></i>
                </span> -->

                <h2>
                    الانضمام لعشيرة جوالة كلية العلوم
                </h2>

                <p>
                    جامعة عين شمس
                </p>

                <div class="title-line"></div>

                <p class="intro">
                    جاهز تكون جزء من الفريق؟
                    <br>
                    سجّل بياناتك وابدأ رحلتك مع عشيرة جوالة كلية العلوم.
                </p>

            </div>


            <!-- Form Card -->
            <div class="form-card">
                <form id="join-form">

                    <!-- Personal Data -->
                    <div class="form-section">

                        <div class="section-title">
                            <span>
                                <i class="fa-solid fa-user"></i>
                            </span>

                            <div>
                                <h3>بياناتك الشخصية</h3>
                                <p>خلينا نتعرف عليك</p>
                            </div>
                        </div>


                        <div class="input-group">
                            <label for="name">الاسم</label>

                            <div class="input-wrapper">
                                <i class="fa-regular fa-user"></i>
                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    placeholder="اكتب اسمك بالكامل"
                                >
                            </div>
                            <span class="erorr" id="nameErorr"></span>
                        </div>

                        <div class="input-group">
                            <label for="phone">رقم التليفون</label>

                            <div class="input-wrapper">
                                <i class="fa-solid fa-phone"></i>
                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="01xxxxxxxxx"
                                >
                            </div>
                            <span class="erorr" id="phoneErorr"></span>
                        </div>

                        <div class="input-group">
                            <label for="email">
                                البريد الإلكتروني
                            </label>
                            <div class="input-wrapper">
                                <i class="fa-regular fa-envelope"></i>
                            
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="example@gmail.com"
                                >
                            </div>
                            <span class="erorr" id="emailErorr"></span>
                            </div>

                            <div class="input-group">
                                <label for="scouting">
                                    شاركت في جوالة | كشافة قبل كدا ؟
                                </label>
                                
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-book-open"></i>
                                
                                    <input
                                        type="text"
                                        id="scouting"
                                        name="scouting"
                                        placeholder="مثال: اه  |  لا"
                                    >
                                </div>
                                <span class="erorr" id="scoutingErorr"></span>
                            </div>

                            <div class="input-group">
                                <label for="exp">
                                    شاركت في انشطة داخل او خارج الكلية ؟ (لو اه اذكر المكان)
                                </label>
                                
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-book-open"></i>
                                
                                    <input
                                        type="text"
                                        id="exp"
                                        name="exp"
                                        placeholder="مثال: اه  |  لا"
                                    >
                                </div>
                                <span class="erorr" id="expErorr"></span>
                            </div>
                            <div class="input-group gender-group">

                                <label>النوع</label>
                            
                                <div class="gender-options">
                            
                                    <label class="gender-option">
                                        <input type="radio"  name="gender" value="male">
                            
                                        <div class="gender-card">
                                            <i class="fa-solid fa-person"></i>
                                            <span>ذكر</span>
                                        </div>
                                    </label>
                            
                            
                                    <label class="gender-option">
                                        <input type="radio" name="gender" value="female">
                            
                                        <div class="gender-card">
                                            <i class="fa-solid fa-person-dress"></i>
                                            <span>أنثى</span>
                                        </div>
                                    </label>
                            
                                </div>
                                <span class="erorr" id="genderErorr"></span>
                            </div>
                    </div>


                    

                    <!-- Academic Data -->
                    <div class="form-section">

                        <div class="section-title">
                            <span>
                                <i class="fa-solid fa-graduation-cap"></i>
                            </span>
<div>
    <h3>بياناتك الدراسية</h3>
    <p>بيانات خاصة بالكلية</p>
</div>
</div>


<div class="input-group">
<label for="year">الفرقة</label>

<div class="input-wrapper">
    <i class="fa-solid fa-layer-group"></i>

    <select id="year" name="year">
        <option value="" selected disabled>
            اختر الفرقة
        </option>

        <option value="الأولى">
            الفرقة الأولى
        </option>

        <option value="الثانية">
            الفرقة الثانية
        </option>

        <option value="الثالثة">
            الفرقة الثالثة
        </option>

        <option value="الرابعة">
            الفرقة الرابعة
        </option>
    </select>
</div>
<span class="erorr" id="yearErorr"></span>
</div>


<div class="input-group">
<label for="program">
    الشعبة / البرنامج
</label>

<div class="input-wrapper">
    <i class="fa-solid fa-book-open"></i>

    <input
        type="text"
        id="program"
        name="program"
        placeholder="مثال: علوم حاسب"
    >
</div>
<span class="erorr" id="programErorr"></span>
</div>

<div class="input-group">
    <label for="listen">
        سمعت عننا منين ؟
    </label>
    
    <div class="input-wrapper">
        <i class="fa-solid fa-book-open"></i>
    
        <input
            type="text"
            id="listen"
            name="listen"
            placeholder="مثال: الكلية"
        >
    </div>
    <span class="erorr" id="listenErorr"></span>
    </div>

</div>


<!-- Submit -->
<button type="submit" class="submit-btn">

<span>
انضم للعشيرة
</span>

<i class="fa-solid fa-arrow-left"></i>

</button>

<p class="form-note">
<i class="fa-solid fa-shield-halved"></i>
بياناتك تستخدم لأغراض التسجيل في العشيرة فقط.
</p>

</form>

</div>

</section>

</main>


<script src="js/join.js" type="module"></script>


</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أرشيف الفعاليات | ASU Science Rover</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/events-archive.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <main class="archive-page">

        <div class="archive-container">

            <!-- Heading -->

            <div class="archive-heading">

                <span>ASU SCIENCE ROVER</span>

                <h1>أرشيف <strong>الفعاليات</strong></h1>

                <p>
                    كل فعالية حكاية، وكل ذكرى جزء من تاريخ عشيرتنا ❤️
                </p>

            </div>


            <!-- Back -->

            <a href="index.html#events" class="archive-back">

                <i class="fas fa-arrow-right"></i>

                العودة للصفحة الرئيسية

            </a>


            <!-- Search -->

            <div class="archive-search">

                <i class="fas fa-search"></i>

                <input
                    type="search"
                    id="eventSearch"
                    placeholder="ابحث عن فعالية..."
                >

            </div>


            <!-- Events Count -->

            <div class="archive-results">

                <h3>جميع الأحداث السابقة</h3>

                <span id="eventsCount"></span>

            </div>


            <!-- Events Grid -->

            <div class="archive-grid" id="archiveGrid">
            </div>


            <!-- Empty State -->

            <div class="archive-empty" id="archiveEmpty" hidden>

                <i class="fas fa-search"></i>

                <h3>لم نعثر على أي أحداث</h3>

                <p>جرب البحث بكلمات مختلفة.</p>

            </div>


            <!-- Back to Top -->

            <div class="archive-footer">

                <a href="index.html#events">
                    العودة إلى الصفحة الرئيسية
                </a>

            </div>

        </div>

    </main>


    <script src="js/events-data.js"></script>
    <script src="js/events-archive.js"></script>

</body>
</html>
